spring.application.name=expensemanagement
server.port=8080

app.dev-identity.enabled=true

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5500

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/expense_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

